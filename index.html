<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>TipCalc</title>
  <link rel="apple-touch-icon" sizes="57x57" href="/assets/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/assets/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/assets/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/assets/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/assets/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/assets/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <meta name="msapplication-TileColor" content="#1a2d44">
  <meta name="msapplication-TileImage" content="/assets/ms-icon-144x144.png">
  <meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1c2e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div class="app">

    <div class="scroll-area">

      <div class="toolbar">
        <button class="theme-toggle" id="themeToggle" aria-label="Switch color theme">Auto</button>
      </div>

      <div class="bill-display" id="billDisplay" role="status" aria-live="polite">$0.00</div>

      <div class="tip-control">
        <div class="tip-header">
          <label for="tipPercentage">Tip</label>
          <span id="tipValue">15%</span>
        </div>
        <input type="range" id="tipPercentage" min="0" max="30" value="15" step="1"
          aria-label="Tip percentage" aria-valuetext="15%" />
      </div>

      <div class="select-wrapper">
        <select id="tipOption">
          <option value="exact">Exact Tip</option>
          <option value="roundTipUp">Round Tip Up</option>
          <option value="roundTipDown">Round Tip Down</option>
          <option value="roundTotalUp">Round Total Up</option>
          <option value="roundTotalDown">Round Total Down</option>
          <option value="survey">Survey</option>
        </select>
      </div>

      <div id="surveyInputs" class="survey-panel">
        <div class="survey-grid">
          <label for="serviceRating">Service</label>
          <div class="select-wrapper select-wrapper--sm">
            <select id="serviceRating">
              <option value="4">A</option>
              <option value="3">B</option>
              <option value="2">C</option>
              <option value="1">D</option>
              <option value="0">F</option>
            </select>
          </div>
          <label for="foodRating">Food</label>
          <div class="select-wrapper select-wrapper--sm">
            <select id="foodRating">
              <option value="4">A</option>
              <option value="3">B</option>
              <option value="2">C</option>
              <option value="1">D</option>
              <option value="0">F</option>
            </select>
          </div>
          <label for="drinksRating">Drinks</label>
          <div class="select-wrapper select-wrapper--sm">
            <select id="drinksRating">
              <option value="4">A</option>
              <option value="3">B</option>
              <option value="2">C</option>
              <option value="1">D</option>
              <option value="0">F</option>
            </select>
          </div>
          <label for="atmosphereRating">Atmosphere</label>
          <div class="select-wrapper select-wrapper--sm">
            <select id="atmosphereRating">
              <option value="4">A</option>
              <option value="3">B</option>
              <option value="2">C</option>
              <option value="1">D</option>
              <option value="0">F</option>
            </select>
          </div>
        </div>
      </div>

      <div class="results">
        <div class="result-row result-meta">
          <span>Effective Tip</span>
          <span id="effectiveTipPercentage">0%</span>
        </div>
        <div class="result-row result-bill">
          <span>Bill</span>
          <span id="billResult">$0.00</span>
        </div>
        <div class="result-row result-tip">
          <span>Tip</span>
          <span id="tipAmount">$0.00</span>
        </div>
        <div class="result-row result-total" id="totalRow"
          role="button" tabindex="0" aria-label="Total — tap to copy">
          <span>Total</span>
          <span id="totalAmount">$0.00</span>
        </div>
      </div>

    </div>

    <div class="keypad">
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button onclick="clearAmount()" class="btn-action">C</button>
      <button onclick="appendNumber('0')">0</button>
      <button onclick="backspace()" class="btn-action">⌫</button>
    </div>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/tipcalc/service-worker.js')
        .then(registration => {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    }
  </script>
</body>

</html>
